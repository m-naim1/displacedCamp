[project]
name = "dispalecdcamp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.4",
    "asgi-correlation-id>=5.0.1",
    "asyncpg>=0.32.0",
    "bcrypt>=5.0.0",
    "fastapi>=0.124.0",
    "itsdangerous>=2.2.0",
    "openpyxl>=3.1.5",
    "passlib[bcrypt]>=1.7.4",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "pydantic-settings>=2.12.0",
    "pydantic[email]>=2.12.5",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.22",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.0.45",
    "starlette-admin>=0.16.0",
    "structlog>=26.1.0",
    "tzdata>=2026.1",
    "uvicorn>=0.38.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ty>=0.0.33",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = [
    "alembic/env.py",
    "alembic/versions/*.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"] # Error, Flake8, isort, pyupgrade, bugbear
ignore = ["B008","E712"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
